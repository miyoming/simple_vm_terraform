
trigger: none

pool:
  vmImage: ubuntu-latest

variables:
  strgrg: 'rg-terraform-demo'
  stgacct: 'stgmdemo1064155300'
  stgcont: 'tfstate'
  stgkey: 'simple_vm_key.tfstate'
  nsg_name: 'simple-vm-nsg'
  


stages:
- stage: tfvalidate
  jobs:
  - job: Keyvault
    steps:
    - task: AzureKeyVault@2
      displayName: Fetch keyvault
      inputs:
        azureSubscription: 'miyoming_vm'
        KeyVaultName: 'miyoming-keyvault'
        SecretsFilter: '*'
        RunAsPreJob: true

    - task: TerraformInstaller@1
      displayName: Install Terraform
      inputs:
        terraformVersion: '1.15.9'

    - task: TerraformTask@5
      displayName: Terraform init
      inputs:
        provider: 'azurerm'
        command: 'init'
        backendServiceArm: 'miyoming_vm'
        backendAzureRmResourceGroupName: '$(strgrg)'
        backendAzureRmStorageAccountName: '$(stgacct)'
        backendAzureRmContainerName: '$(stgcont)'
        backendAzureRmKey: '$(stgkey)'

    - task: TerraformTask@5
      displayName: Terraform validate
      inputs:
        provider: 'azurerm'
        command: 'validate'

    - task: TerraformTask@5
      displayName: Terraform plan
      inputs:
        provider: 'azurerm'
        command: 'plan'
        environmentServiceNameAzureRM: 'miyoming_vm'
      env:
        TF_VAR_admin_password: $(LocalAdmin)
        TF_VAR_nsg_name: $(nsg_name)
        
        TF_VAR_nsg_rules: allow-all


- stage: tfapply
  dependsOn: tfvalidate
  condition: succeeded('tfvalidate')
  jobs:
  - job: apply_now
    steps:

      - task: AzureKeyVault@2
        displayName: Fetch keyvault
        inputs:
          azureSubscription: 'miyoming_vm'
          KeyVaultName: 'miyoming-keyvault'
          SecretsFilter: '*'
          RunAsPreJob: true


      - task: TerraformInstaller@1
        displayName: Terraform init
        inputs:
          terraformVersion: '1.15.9'

      - task: TerraformTask@5
        displayName: Terraform init
        inputs:
          provider: 'azurerm'
          command: 'init'
          backendServiceArm: 'miyoming_vm'
          backendAzureRmResourceGroupName: '$(strgrg)'
          backendAzureRmStorageAccountName: '$(stgacct)'
          backendAzureRmContainerName: '$(stgcont)'
          backendAzureRmKey: '$(stgkey)'      

      - task: TerraformTask@5
        displayName: Terraform apply
        inputs:
          provider: 'azurerm'
          command: 'apply'
          environmentServiceNameAzureRM: 'miyoming_vm'
        env:
          TF_VAR_admin_password: $(LocalAdmin)
          TF_VAR_nsg_name: $(nsg_name)
          TF_VAR_nsg_rules: $(allow-all)