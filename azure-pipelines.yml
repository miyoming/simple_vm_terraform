# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger: none

pool:
  vmImage: ubuntu-latest

variables:
  strgrg: 'rg-terraform-demo'
  stgacct: 'stgmdemo1064155300'
  stgcont: 'tfstate'
  stgkey: 'simple_vm_key.tfstate'

  

stages:
- stage: tfvalidate
  jobs:
  - job: Keyvault
    steps:
    - task: AzureKeyVault@2
      displayName: Fetch keyvault
      inputs:
        azureSubscription: 'miyoming_vm'
        KeyVaultName: 'miyoming-keyvault'
        SecretsFilter: '$LocalAdmin'
        RunAsPreJob: false

    - task: TerraformInstaller@1
      displayName: Install Terraform
      inputs:
        terraformVersion: '1.15.9'

    - task: TerraformTask@5
      displayName: Terraform init
      inputs:
        provider: 'azurerm'
        command: 'init'
        backendServiceArm: 'miyoming_vm'
        backendAzureRmResourceGroupName: '$(strgrg)'
        backendAzureRmStorageAccountName: '$(stgacct)'
        backendAzureRmContainerName: '$(stgcont)'
        backendAzureRmKey: '$(stgkey)'

    - task: TerraformTask@5
      displayName: Terraform validate
      inputs:
        provider: 'azurerm'
        command: 'validate'

    - task: TerraformTask@5
      displayName: Terraform plan
      inputs:
        provider: 'azurerm'
        command: 'plan'
        environmentServiceNameAzureRM: 'miyoming_vm'
      env:
        TF_VAR_admin_password: $(LocalAdmin)
        TF_VAR_name: $(name)
        TF_VAR_priority: $(priority)
        TF_VAR_direction: $(direction)
        TF_VAR_access: $(access)
        TF_VAR_protocol: $(protocol)
        TF_VAR_source_port_range: $(source_port_range)
        TF_VAR_destination_port_range: $(destination_port_range)
        TF_VAR_source_address_prefix: $(source_address_prefix)
        TF_VAR_destination_address_prefix: $(destination_address_prefix)



- stage: tfapply
  dependsOn: tfvalidate
  condition: succeeded('tfvalidate')
  jobs:
  - job: apply_now
    steps:
      - task: TerraformInstaller@1
        displayName: Terraform init
        inputs:
          terraformVersion: '1.15.9'

      - task: TerraformTask@5
        displayName: Terraform init
        inputs:
          provider: 'azurerm'
          command: 'init'
          backendServiceArm: 'miyoming_vm'
          backendAzureRmResourceGroupName: '$(strgrg)'
          backendAzureRmStorageAccountName: '$(stgacct)'
          backendAzureRmContainerName: '$(stgcont)'
          backendAzureRmKey: '$(stgkey)'      

      - task: TerraformTask@5
        displayName: Terraform apply
        inputs:
          provider: 'azurerm'
          command: 'apply'
          environmentServiceNameAzureRM: 'miyoming_vm'
        env:
          TF_VAR_admin_password: $(LocalAdmin)